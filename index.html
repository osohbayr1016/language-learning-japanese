<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E8B57" />
    <meta
      name="description"
      content="Япон хэл сурах — хичээл, тоглоом, дуу сонсох. Learn Japanese with lessons, games, and audio."
    />
    <meta property="og:title" content="Япон хэл сурах" />
    <meta
      property="og:description"
      content="Япон хэл сурах — хичээл, тоглоом, дуу сонсох."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Япон хэл сурах</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Япон хэл сурах" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Япон хэл" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --plum: #2e8b57;
        --plum-dark: #1f6b42;
        --teal: #3b82f6;
        --paper: #f5f7f8;
        --ink: #17211d;
        --muted: #66736d;
        --border: #dde4e2;
        --focus: #2563eb;
        --soft-brand: #eaf8ef;
        --tabbar-h: 74px;
        --sidebar-w: 220px;
        --content-w: 680px;
        --rail-w: 270px;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--paper);
        background-image: radial-gradient(circle at 50% -120px, #effaf2 0, transparent 440px);
        background-attachment: fixed;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-family: "Noto Sans", "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background: transparent;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
        border-radius: 6px;
      }

      ::selection {
        background: #f6d9e4;
        color: var(--ink);
      }

      /* ── Product shell ─────────────────────────────────────────────────── */
      #app-column {
        width: 100%;
        min-height: 100%;
        background: transparent;
      }

      .web-shell {
        min-height: 100vh;
      }

      .web-shell--tabs {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .web-shell__main {
        min-width: 0;
        min-height: 100vh;
        background: #fff;
      }

      .web-shell--tabs .web-shell__main {
        order: 1;
        min-height: calc(100vh - var(--tabbar-h));
        flex: 1 0 auto;
      }

      .web-shell--tabs .tabbar {
        order: 2;
      }

      .route-stage {
        min-height: 100%;
        animation: route-enter 180ms cubic-bezier(0.2, 0, 0, 1);
      }

      @keyframes route-enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Mobile navigation ─────────────────────────────────────────────── */
      .tabbar {
        display: flex;
        align-items: stretch;
        gap: 4px;
        height: var(--tabbar-h);
        padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px));
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 18px rgba(23, 33, 29, 0.06);
        position: sticky;
        bottom: 0;
        z-index: 20;
      }

      .tabbar__brand {
        display: none;
      }

      .tabbar__items {
        display: flex;
        flex: 1;
        gap: 4px;
      }

      .tabbar__item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        border-radius: 14px;
        text-decoration: none;
        color: var(--muted);
        transition: transform 120ms ease, background-color 160ms ease, color 160ms ease;
      }

      .tabbar__item:hover {
        background: #f4f8f5;
      }

      .tabbar__item:active {
        transform: scale(0.94);
      }

      .tabbar__pill {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 28px;
        border-radius: 999px;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .tabbar__item.is-active .tabbar__pill {
        background: var(--soft-brand);
        transform: translateY(-1px);
      }

      .tabbar__label {
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
      }

      .tabbar__item.is-active .tabbar__label {
        color: var(--plum);
        font-weight: 900;
      }

      .right-rail {
        display: none;
      }

      @media (min-width: 720px) and (max-width: 1023px) {
        #app-column {
          max-width: 680px !important;
          margin: 20px auto;
          min-height: calc(100% - 40px);
          border-radius: 26px;
          border: 1px solid var(--border);
          box-shadow: 0 18px 48px rgba(23, 33, 29, 0.10);
          overflow: hidden;
        }
      }

      @media (min-width: 1024px) {
        #app-column {
          max-width: 1240px !important;
          margin: 0 auto;
          overflow: visible;
        }

        .web-shell--tabs {
          display: grid;
          grid-template-columns: var(--sidebar-w) minmax(0, var(--content-w)) var(--rail-w);
          gap: 32px;
          align-items: start;
          justify-content: center;
          padding: 24px 18px 48px;
        }

        .web-shell--tabs .tabbar,
        .web-shell--tabs .web-shell__main {
          order: initial;
        }

        .web-shell--tabs .web-shell__main {
          min-height: calc(100vh - 48px);
          border: 1px solid var(--border);
          border-radius: 28px;
          overflow: hidden;
          box-shadow: 0 12px 36px rgba(23, 33, 29, 0.06);
        }

        .web-shell--plain {
          max-width: 760px;
          margin: 0 auto;
          min-height: 100vh;
          background: #fff;
        }

        .tabbar {
          position: sticky;
          top: 24px;
          bottom: auto;
          height: auto;
          min-height: 0;
          flex-direction: column;
          align-self: start;
          padding: 0;
          gap: 14px;
          border: 0;
          box-shadow: none;
          background: transparent;
          backdrop-filter: none;
        }

        .tabbar__brand {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 6px 10px 18px;
          text-decoration: none;
          color: var(--ink);
        }

        .tabbar__brand-mark {
          width: 48px;
          height: 48px;
          border-radius: 16px;
          display: grid;
          place-items: center;
          background: var(--plum);
          color: #fff;
          font-family: "Noto Sans JP", sans-serif;
          font-size: 24px;
          font-weight: 800;
          border-bottom: 4px solid var(--plum-dark);
        }

        .tabbar__brand-copy {
          display: flex;
          flex-direction: column;
          min-width: 0;
        }

        .tabbar__brand-copy strong {
          font-size: 19px;
          line-height: 1.1;
        }

        .tabbar__brand-copy small {
          margin-top: 3px;
          color: var(--muted);
          font-size: 10px;
          line-height: 1.25;
        }

        .tabbar__items {
          flex-direction: column;
          gap: 6px;
        }

        .tabbar__item {
          min-height: 56px;
          flex: none;
          flex-direction: row;
          justify-content: flex-start;
          gap: 12px;
          padding: 0 14px;
          border: 2px solid transparent;
          border-radius: 16px;
        }

        .tabbar__item:hover {
          background: #f4f8f5;
        }

        .tabbar__item.is-active {
          background: var(--soft-brand);
          border-color: #cdebd7;
        }

        .tabbar__pill {
          width: 36px;
          height: 36px;
        }

        .tabbar__item.is-active .tabbar__pill {
          background: transparent;
          transform: none;
        }

        .tabbar__label {
          font-size: 15px;
          font-weight: 800;
        }

        .right-rail {
          position: sticky;
          top: 24px;
          display: flex;
          flex-direction: column;
          gap: 14px;
          align-self: start;
        }

        .rail-card {
          border: 2px solid var(--border);
          border-radius: 20px;
          background: #fff;
          padding: 18px;
        }

        .rail-card--goal {
          border-color: #cdebd7;
          background: linear-gradient(180deg, #f7fdf9 0%, #fff 100%);
        }

        .rail-card--tip {
          background: #fbfcfb;
        }

        .rail-card__eyebrow {
          color: var(--plum);
          font-size: 10px;
          font-weight: 900;
          letter-spacing: 1px;
          margin-bottom: 10px;
        }

        .rail-card p {
          color: var(--muted);
          font-size: 13px;
          line-height: 1.5;
          margin: 8px 0 0;
        }

        .rail-goal__top {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 12px;
          color: var(--ink);
        }

        .rail-goal__top strong {
          font-size: 18px;
        }

        .rail-goal__top span {
          color: var(--plum);
          font-size: 12px;
          font-weight: 900;
        }

        .rail-progress {
          height: 12px;
          margin-top: 10px;
          border-radius: 999px;
          overflow: hidden;
          background: #e8eeeb;
        }

        .rail-progress__fill {
          height: 100%;
          border-radius: 999px;
          background: var(--plum);
          transition: width 420ms cubic-bezier(0.05, 0.7, 0.1, 1);
        }

        .rail-stat {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .rail-stat + .rail-stat {
          margin-top: 14px;
          padding-top: 14px;
          border-top: 1px solid var(--border);
        }

        .rail-stat__icon {
          width: 38px;
          height: 38px;
          display: grid;
          place-items: center;
          border-radius: 13px;
          background: #f5f7f8;
          font-size: 20px;
        }

        .rail-stat div {
          display: flex;
          flex-direction: column;
        }

        .rail-stat strong {
          color: var(--ink);
          font-size: 14px;
        }

        .rail-stat span:not(.rail-stat__icon) {
          margin-top: 2px;
          color: var(--muted);
          font-size: 11px;
        }

        .rail-link {
          display: inline-block;
          margin-top: 12px;
          color: var(--plum);
          font-size: 13px;
          font-weight: 900;
          text-decoration: none;
        }

        * {
          scrollbar-width: thin;
          scrollbar-color: #cfd8d4 transparent;
        }

        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }

        ::-webkit-scrollbar-track {
          background: transparent;
        }

        ::-webkit-scrollbar-thumb {
          background: #cfd8d4;
          border-radius: 999px;
          border: 3px solid transparent;
          background-clip: content-box;
        }
      }

      /* ── Admin header ────────────────────────────────────────────────────
         The tab bar is hidden inside /admin, so this bar is the only way out. */
      .admin {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .admin__bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 8px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 15;
      }
      .admin__title {
        flex: 1;
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        text-align: center;
        color: var(--ink);
      }
      .admin__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
        color: var(--ink);
      }
      .admin__btn:hover {
        background: #faf8f6;
      }

      .crash {
        margin: auto;
        padding: 40px 24px;
        max-width: 720px;
        text-align: center;
      }
      .crash h1 {
        color: var(--plum);
        margin: 0 0 8px;
      }
      .crash__actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 20px 0;
      }
      .crash__actions button,
      .crash__actions a {
        padding: 10px 18px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
      }
      .crash__detail {
        text-align: left;
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.5;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        overflow-x: auto;
        color: #7a2b2b;
      }

      /* Route-chunk loading placeholder. Mirrors the shape of a hub screen
         (heading, sub, cards) so content arrival does not jump the layout. */
      .skeleton {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .skeleton__line,
      .skeleton__card {
        border-radius: 12px;
        background: linear-gradient(90deg, #eae5e0 25%, #f3efeb 37%, #eae5e0 63%);
        background-size: 400% 100%;
        animation: skeleton-shimmer 1.4s linear infinite;
      }
      .skeleton__line--title {
        height: 30px;
        width: 55%;
        border-radius: 8px;
        margin-top: 8px;
      }
      .skeleton__line--sub {
        height: 14px;
        width: 75%;
        border-radius: 7px;
        margin-bottom: 8px;
      }
      .skeleton__card {
        height: 128px;
        border-radius: 16px;
      }
      .skeleton__card--short {
        height: 88px;
      }
      @keyframes skeleton-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0 0;
        }
      }

      .notfound {
        margin: auto;
        padding: 48px 24px;
        text-align: center;
        max-width: 380px;
      }
      .notfound__mark {
        width: 96px;
        height: 96px;
        margin: 0 auto 20px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: var(--soft-brand);
        border: 1px solid var(--border);
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 1px;
        color: var(--plum);
      }
      .notfound__title {
        font-size: 24px;
        line-height: 1.25;
        margin: 0 0 8px;
        color: var(--ink);
      }
      .notfound__body {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .notfound__path {
        margin: 0 0 24px;
      }
      .notfound__path code {
        font-size: 12px;
        color: var(--muted);
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        word-break: break-all;
      }
      .notfound__actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* Matches the in-app Button primitive: pill, plinth, sink on press. */
      .notfound__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 50px;
        padding: 0 24px;
        border-radius: 999px;
        font-weight: 800;
        text-decoration: none;
        color: var(--ink);
        background: #fff;
        border: 2px solid #cfcbc5;
        transition: transform 140ms cubic-bezier(0.2, 0, 0, 1),
          background-color 140ms cubic-bezier(0.2, 0, 0, 1),
          box-shadow 140ms cubic-bezier(0.2, 0, 0, 1);
      }
      .notfound__btn:hover {
        background: #faf8f6;
      }
      .notfound__btn:active {
        transform: scale(0.97);
      }
      .notfound__btn--primary {
        color: #fff;
        background: var(--plum);
        border: 0;
        border-bottom: 4px solid var(--plum-dark);
      }
      .notfound__btn--primary:hover {
        background: #cb5686;
      }
      .notfound__btn--primary:active {
        transform: translateY(4px);
        border-bottom-width: 0;
        margin-bottom: 4px;
      }

      /* ── Boot shell ──────────────────────────────────────────────────────
         Shaped like the screen that follows, so the handover doesn't jump. */
      #web-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        transition: opacity 0.22s cubic-bezier(0.2, 0, 0, 1);
      }
      #web-boot-splash .boot-inner {
        width: 240px;
        text-align: center;
      }
      #web-boot-splash .boot-logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--plum), var(--teal));
        box-shadow: 0 8px 22px rgba(190, 74, 121, 0.32);
        animation: boot-pulse 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #web-boot-splash .boot-line {
        height: 10px;
        border-radius: 6px;
        background: linear-gradient(90deg, #eae5e0 25%, #f3efeb 37%, #eae5e0 63%);
        background-size: 400% 100%;
        margin-bottom: 8px;
        animation: boot-shimmer 1.4s linear infinite;
      }
      #web-boot-splash .boot-line.short {
        width: 65%;
        margin: 0 auto;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.78;
        }
      }
      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="web-boot-splash" aria-hidden="true">
      <div class="boot-inner">
        <div class="boot-logo"></div>
        <div class="boot-line"></div>
        <div class="boot-line short"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
