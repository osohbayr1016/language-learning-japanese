name: Quality checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Types, curriculum, API and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run api:typecheck
      - run: npm run check:isolation
      - run: npm test
      - run: npm run build
      - name: Guard production JavaScript chunk budget
        run: node scripts/check-bundle.mjs
  e2e:
    name: Chromium learner journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain traces and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-course-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
