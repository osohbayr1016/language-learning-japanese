name: Quality checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Keep install behavior identical to the existing production deploy job.
      - name: Install website dependencies
        run: npm ci

      # The current web tsconfig does not mirror Vite's RN/Expo aliases and
      # currently reports hundreds of baseline errors. Keep the debt visible
      # without hiding whether the actual production bundle still builds.
      - name: Audit existing web TypeScript debt
        id: web_typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Build production website
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test "$(find dist -type f | wc -l)" -gt 1 || { echo "Production build is unexpectedly empty"; exit 1; }

      - name: Guard web JavaScript chunk size
        run: |
          largest="$(find dist/assets -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -1)"
          bytes="$(printf '%s' "$largest" | awk '{print $1}')"
          file="$(printf '%s' "$largest" | cut -d' ' -f2-)"
          echo "Largest JS chunk: $bytes bytes ($file)"
          test "$bytes" -le 600000 || {
            echo "::error::Largest web JS chunk exceeds 600 KB raw budget: $file ($bytes bytes)"
            exit 1
          }

      - name: Report web typecheck debt
        if: always() && steps.web_typecheck.outcome == 'failure'
        run: echo "::warning::Web TypeScript baseline is still red; see docs/JAPANESE-LEARNING-AUDIT.md."

  workspace:
    name: API and mobile validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # pnpm-lock.yaml is currently stale versus the root package.json.
      # Reconcile it in a package-manager cleanup; do not let that hide API errors.
      - name: Install workspace for validation
        run: pnpm install --no-frozen-lockfile

      - name: Type-check API
        run: pnpm --dir apps/api type-check

      - name: Test API domains
        run: pnpm dlx tsx@4.21.0 --test apps/api/tests/*.test.ts

      - name: Test mobile pure domains
        run: pnpm dlx tsx@4.21.0 --test apps/mobile/tests/*.test.ts

      - name: Audit mobile TypeScript debt
        id: mobile_typecheck
        continue-on-error: true
        run: pnpm --dir apps/mobile type-check

      - name: Report mobile typecheck debt
        if: always() && steps.mobile_typecheck.outcome == 'failure'
        run: echo "::warning::Mobile TypeScript baseline is red; inspect this job before merging."


  e2e:
    name: Critical learner E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Build website for browser tests
        run: npm run build

      # Keep browser tooling out of the production dependency graph. CI installs
      # a pinned runner temporarily after the deterministic npm ci install.
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical learner journeys
        run: npx playwright test e2e/study-critical.spec.ts
