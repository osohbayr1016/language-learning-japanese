name: Release Japanese production
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.gitignore']
  workflow_dispatch:
  workflow_call:
concurrency:
  group: release-japanese-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    name: Verify, migrate and deploy API before web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - run: npm ci
      - run: npm run typecheck
      - run: npm run api:typecheck
      - run: npm run check:isolation
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify credentials and record a D1 restore point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-preflight.mjs
      - name: Retain restore-point metadata (no user data or secrets)
        uses: actions/upload-artifact@v4
        with:
          name: japanese-release-checkpoint-${{ github.run_id }}
          path: release-checkpoint.json
          retention-days: 7
          if-no-files-found: error
      - name: Apply Japanese database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: aabe952df5d4e4b780339bf3b4217ed7
          workingDirectory: apps/api
          wranglerVersion: '4.87.0'
          command: d1 migrations apply nihongo-mn-db --remote --env production
      - name: Deploy the Japanese API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: aabe952df5d4e4b780339bf3b4217ed7
          workingDirectory: apps/api
          wranglerVersion: '4.87.0'
          command: deploy --env production --var BUILD_SHA:${{ github.sha }}
      - name: Verify API schema and deployed commit
        run: node scripts/smoke-production.mjs --api-only
      - name: Deploy the website
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: aabe952df5d4e4b780339bf3b4217ed7
          wranglerVersion: '4.87.0'
          command: deploy --env production
      - name: Verify live course, release, offline pack and auth boundary
        run: node scripts/smoke-production.mjs
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-production-browser-results
          path: test-results/
          retention-days: 7
