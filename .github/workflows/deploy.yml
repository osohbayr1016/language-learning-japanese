name: Deploy website

# Pushing to main deploys the site. Nothing was watching this repo before, so a
# push only ever produced a commit.
on:
  push:
    branches: [main]
    # Changes that cannot affect the built site should not spend a deploy.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

# A second push while one is deploying supersedes it, rather than racing to
# decide which build ends up live.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails loudly
      # if the lockfile has drifted from package.json.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # A build that produced nothing would otherwise deploy an empty site.
      - name: Check the build produced something
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "dist: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      # The deploy needs a Cloudflare API token in the repo's Actions secrets.
      # Without it the build above still runs as a check, and this step
      # explains what is missing instead of failing with a wrangler stack trace.
      - name: Check for the Cloudflare token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "present=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so this push was built but not deployed. Add it under Settings → Secrets and variables → Actions, or run 'npm run deploy' locally."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Use the wrangler pinned in package.json rather than letting the
          # action fetch its own, so CI and `npm run deploy` are the same tool.
          wranglerVersion: '4.87.0'
          command: deploy --env production
